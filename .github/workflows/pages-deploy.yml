name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Fix sitemap XML for crawlers
        run: |
          SITE_DIR="_site${{ steps.pages.outputs.base_path }}"
          if [ -f "$SITE_DIR/sitemap.xml" ]; then
            sed -i 's/ xmlns:xsi="[^"]*" xsi:schemaLocation="[^"]*"//g' "$SITE_DIR/sitemap.xml"
          fi

      - name: Validate SEO discovery files
        run: |
          SITE_DIR="_site${{ steps.pages.outputs.base_path }}"
          test -f "$SITE_DIR/sitemap.xml"
          test -f "$SITE_DIR/feed.xml"
          test -f "$SITE_DIR/robots.txt"
          test -f "$SITE_DIR/llms.txt"
          grep -q '<urlset' "$SITE_DIR/sitemap.xml"
          grep -q '<feed' "$SITE_DIR/feed.xml"
          grep -q 'Sitemap:' "$SITE_DIR/robots.txt"
          ENTRY_COUNT=$(grep -c '<entry>' "$SITE_DIR/feed.xml" || true)
          if [ "$ENTRY_COUNT" -lt 8 ]; then
            echo "Expected at least 8 feed entries, found $ENTRY_COUNT"
            exit 1
          fi

      - name: Test site
        run: |
          bundle exec htmlproofer _site${{ steps.pages.outputs.base_path }} \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
